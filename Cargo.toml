[package]
name = "chem-wasm-lens"
version = "0.2.8"
edition = "2021"
description = "Ultra-lightweight WebAssembly kernel for cheminformatics: XYZ/PDB/SDF/SMILES/CML parsing, bond detection, ring & stereo analysis, fingerprints, 2D depiction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/chem-wasm-lens"
homepage = "https://kent-tokyo.github.io/chem-wasm-lens/examples/"
documentation = "https://github.com/kent-tokyo/chem-wasm-lens#readme"
readme = "README.md"
keywords = ["wasm", "cheminformatics", "smiles", "chemistry", "molecular"]
categories = ["science", "wasm", "parsing", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
parallel = ["dep:rayon"]

[dependencies]
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
rayon = { version = "=1.12.0", optional = true }
quick-xml = { version = "0.40", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.71"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[[bench]]
name = "mol_bench"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
