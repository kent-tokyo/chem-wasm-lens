[package]
name = "chem-wasm-lens"
version = "0.2.2"
edition = "2021"
description = "Ultra-lightweight molecular analysis kernel (XYZ/PDB parsing, bond detection, spatial queries) compiled to WebAssembly"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/chem-wasm-lens"
homepage = "https://github.com/kent-tokyo/chem-wasm-lens"
documentation = "https://github.com/kent-tokyo/chem-wasm-lens#readme"
readme = "README.md"
keywords = ["wasm", "chemistry", "molecular", "cheminformatics"]
categories = ["science", "wasm", "parsing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
parallel = ["dep:rayon"]

[dependencies]
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
rayon = { version = "=1.12.0", optional = true }
quick-xml = { version = "0.37", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.71"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[[bench]]
name = "mol_bench"
harness = false

[profile.release]
opt-level = "s"
lto = true
